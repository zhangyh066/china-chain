name: 每周数据周报

# 北京时间周一 09:30（UTC 01:30），用仓库里已有的数据出一份周报 Issue。
# 周报本身不联网、不更新数据——数据滞后时如实写滞后区间（见脚本头部说明）。
# 觉得吵就把 schedule 注释掉，改为手动 dispatch。
on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成周报（只读仓库数据，不联网）
        run: python pipeline/weekly_report.py

      - name: 发周报 Issue（同区间已发过则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(head -1 weekly_report.md | sed 's/^# //')
          if gh issue list --state all --limit 50 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "本期周报已存在：$TITLE"
          else
            gh issue create --title "$TITLE" --body-file weekly_report.md
          fi
